<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Climate Chaser</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(160deg, #050b1f, #101a3c 60%, #2b2547);
        color: #e8eef7;
      }
      main { max-width: 420px; padding: 32px 24px; text-align: center; }
      h1 { font-size: 1.6rem; margin: 0 0 8px; }
      p { color: #9db2cc; line-height: 1.6; font-size: 0.95rem; }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 28px;
        border-radius: 12px;
        background: #38bdf8;
        color: #0b1220;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible, a:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Climate Chaser couldn't reach the network. If you've opened the app before, your
        last known weather (marked as stale, with its update time) is still available — it
        is never presented as live data.
      </p>
      <a href="/">Back to the app</a>
    </main>
  </body>
</html>
